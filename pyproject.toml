[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "runway-unitcost"
version = "0.1.0"
description = "Pre-flight per-second dollar cost estimates for Runway video generation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["runway", "video", "cost", "estimate", "pricing", "credits"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dhyabi2/runway-unitcost"

[tool.setuptools]
packages = ["runway_unitcost"]
